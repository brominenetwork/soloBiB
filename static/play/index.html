<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>soloBiB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #game-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 1;
    }

    #game-frame.visible { opacity: 1; }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    #loader.out {
      opacity: 0;
      pointer-events: none;
    }

    #logo-img {
      width: 168px;
      height: 168px;
      object-fit: contain;
      animation: logoSpin 1.4s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes logoSpin {
      0%   { transform: rotate(0deg);   animation-timing-function: ease-in; }
      50%  { transform: rotate(180deg); animation-timing-function: ease-out; }
      100% { transform: rotate(360deg); }
    }

    #brand-text {
      font-family: "Parkinsans", sans-serif;
      font-weight: 700;
      font-size: 52px;
      color: #fff;
      display: flex;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
      user-select: none;
    }

    #brand-text.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #brand-text span {
      display: inline-block;
      animation: wave 1.6s ease-in-out 3 both;
      animation-delay: calc(var(--i) * 80ms);
    }

    @keyframes wave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    #err {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #000;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.4);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
    }

    #err.show { display: flex; }

    #game-ui {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    #game-ui.active { display: block; }

    #trigger {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 52px;
      height: 40px;
      background: rgba(20,20,20,0.92);
      border-radius: 0 0 14px 14px;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.15s;
      z-index: 12;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-top: none;
      gap: 0;
      flex-direction: column;
    }

    #trigger:hover { background: rgba(35,35,35,0.96); }

    #trigger .bar {
      width: 18px;
      height: 2px;
      background: rgba(255,255,255,0.85);
      border-radius: 2px;
      margin: 2px 0;
    }

    #overlay-bg {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #game-ui.open #overlay-bg {
      opacity: 1;
      pointer-events: auto;
    }

    #navbar {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      height: 52px;
      width: max-content;
      max-width: calc(100vw - 32px);
      background: rgba(14,14,14,0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 11;
    }

    #game-ui.open #navbar {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    #nav-logo {
      width: 36px;
      height: 36px;
      object-fit: contain;
      cursor: pointer;
      border-radius: 8px;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }

    #nav-logo:hover { opacity: 0.75; }

    .nav-spacer { flex: 1; }

    .nav-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: rgba(255,255,255,0.07);
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      position: relative;
      flex-shrink: 0;
      color: #fff;
    }

    .nav-btn:hover { background: rgba(255,255,255,0.14); }

    .nav-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: rgba(255,255,255,0.85);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #vol-popup {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      right: 0;
      background: rgba(18,18,18,0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 10px;
      align-items: center;
      flex-direction: column;
      gap: 8px;
      width: 44px;
    }

    #vol-popup.open { display: flex; }

    #vol-slider {
      -webkit-appearance: none;
      appearance: none;
      writing-mode: vertical-lr;
      direction: rtl;
      width: 4px;
      height: 100px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    #vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    #vol-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: none;
      cursor: pointer;
    }

    #vol-label {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
  <iframe
    id="game-frame"
    allowfullscreen
    allow="autoplay; fullscreen; clipboard-write; microphone; camera; gamepad; accelerometer; gyroscope"
  ></iframe>

  <div id="loader">
    <img id="logo-img" src="/logo.png" alt="">
    <div id="brand-text">
      <span style="--i:0">s</span><span style="--i:1">o</span><span style="--i:2">l</span><span style="--i:3">o</span><span style="--i:4">B</span><span style="--i:5">i</span><span style="--i:6">B</span>
    </div>
  </div>

  <div id="err">error, sorry!</div>

  <div id="game-ui">
    <div id="overlay-bg"></div>
    <div id="trigger"></div>
    <div id="navbar">
      <img id="nav-logo" src="/logo.png" alt="home">
      <div class="nav-spacer"></div>
      <div class="nav-btn" id="vol-btn">
        <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <div id="vol-popup">
          <input id="vol-slider" type="range" min="0" max="100" value="100" orient="vertical">
          <span id="vol-label">100</span>
        </div>
      </div>
      <div class="nav-btn" id="shot-btn">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
    </div>
  </div>

  <script src="/three.min.js"></script>
  <script src="/vantafog.min.js"></script>
  <script>
    VANTA.FOG({
      el: "#loader",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200,
      minWidth: 200,
      highlightColor: 0x965c32,
      midtoneColor: 0x916450,
      lowlightColor: 0x826d3b,
      baseColor: 0xf0900,
      blurFactor: 0.90,
      speed: 2.40,
      zoom: 0.30
    });

    var raw = location.search.slice(1);

    var useProxy = false;
    if (raw.endsWith("+s")) {
      useProxy = true;
      raw = raw.slice(0, -2);
    } else if (raw.endsWith("%2Bs")) {
      useProxy = true;
      raw = raw.slice(0, -4);
    }

    try { raw = decodeURIComponent(raw); } catch (e) {}

    var targetUrl = "";
    if (raw) {
      if (raw.startsWith("/")) {
        targetUrl = raw;
      } else if (/^https?:\/\//i.test(raw)) {
        targetUrl = raw;
      } else {
        targetUrl = "https://" + raw;
      }

      if (useProxy && !targetUrl.startsWith("/")) {
        try {
          var enc = btoa(encodeURIComponent(targetUrl))
            .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
          targetUrl = "/atlas/" + enc;
        } catch (e) {}
      }
    }

    var logo = document.getElementById("logo-img");
    var brandText = document.getElementById("brand-text");
    var loader = document.getElementById("loader");
    var frame = document.getElementById("game-frame");
    var errEl = document.getElementById("err");
    var gameUi = document.getElementById("game-ui");
    var trigger = document.getElementById("trigger");
    var overlayBg = document.getElementById("overlay-bg");
    var navLogo = document.getElementById("nav-logo");
    var volBtn = document.getElementById("vol-btn");
    var volPopup = document.getElementById("vol-popup");
    var volSlider = document.getElementById("vol-slider");
    var volLabel = document.getElementById("vol-label");
    var shotBtn = document.getElementById("shot-btn");

    var displayName = raw.replace(/^https?:\/\/(www\.)?/, "").split("/")[0] || raw;
    if (displayName) document.title = displayName + " — soloBiB";

    function startSession() {
      loader.classList.add("out");
      frame.classList.add("visible");
      setTimeout(function () {
        loader.style.display = "none";
        gameUi.classList.add("active");
      }, 500);
    }

    brandText.addEventListener("click", function () {
      brandText.style.opacity = "0";
      setTimeout(startSession, 450);
    });

    brandText.querySelector("span:last-child").addEventListener("animationend", function () {
      brandText.style.opacity = "0";
      setTimeout(startSession, 450);
    });

    trigger.addEventListener("click", function () {
      gameUi.classList.toggle("open");
      volPopup.classList.remove("open");
    });

    overlayBg.addEventListener("click", function () {
      gameUi.classList.remove("open");
      volPopup.classList.remove("open");
    });

    navLogo.addEventListener("click", function () {
      window.location.href = "/";
    });

    volBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      volPopup.classList.toggle("open");
    });

    function applyVolume(v) {
      volLabel.textContent = v;
      var frac = v / 100;
      try {
        var doc = frame.contentDocument || frame.contentWindow.document;
        doc.querySelectorAll("video, audio").forEach(function (el) { el.volume = frac; });
      } catch (e) {}
    }

    volSlider.addEventListener("input", function () {
      applyVolume(parseInt(this.value, 10));
    });

    shotBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      navigator.mediaDevices.getDisplayMedia({ video: true, audio: false }).then(function (stream) {
        var video = document.createElement("video");
        video.srcObject = stream;
        video.onloadedmetadata = function () {
          video.play();
          var canvas = document.createElement("canvas");
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          canvas.getContext("2d").drawImage(video, 0, 0);
          stream.getTracks().forEach(function (t) { t.stop(); });
          canvas.toBlob(function (blob) {
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "screenshot.png";
            a.click();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
          }, "image/png");
        };
      }).catch(function () {});
    });

    if (!targetUrl) {
      loader.style.display = "none";
      errEl.classList.add("show");
    } else {
      var revealed = false;

      function showReady() {
        var anims = logo.getAnimations();
        if (!anims.length) { finalize(); return; }
        var anim = anims[0];
        var duration = anim.effect.getTiming().duration;
        var remaining = duration - (anim.currentTime % duration);
        setTimeout(function () {
          try { anim.commitStyles(); } catch (e) {}
          anim.cancel();
          logo.style.transform = "rotate(0deg)";
          void logo.offsetHeight;
          logo.style.transition = "transform 0.55s cubic-bezier(0.4, 0, 0.2, 1)";
          logo.style.transform = "translateY(-52px)";
          setTimeout(function () { brandText.classList.add("visible"); }, 160);
        }, remaining);
      }

      function reveal() {
        if (revealed) return;
        revealed = true;
        showReady();
      }

      frame.src = targetUrl;
      frame.onload = function () { frame.onload = null; reveal(); };
      setTimeout(reveal, 500);
    }
  </script>
</body>
</html>
