<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>soloBiB</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #game-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 1;
    }

    #game-frame.visible { opacity: 1; }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    #loader.out {
      opacity: 0;
      pointer-events: none;
    }

    #logo-img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      animation: logoSpin 1.4s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes logoSpin {
      0%   { transform: rotate(0deg);   animation-timing-function: ease-in; }
      50%  { transform: rotate(180deg); animation-timing-function: ease-out; }
      100% { transform: rotate(360deg); }
    }

    #start-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      color: rgba(255,255,255,0.82);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 500;
      padding: 13px 36px;
      cursor: pointer;
      letter-spacing: 0.05em;
      opacity: 0;
      pointer-events: none;
      transform: translateY(14px);
      transition: opacity 0.45s ease, transform 0.45s ease, background 0.15s, border-color 0.15s;
    }

    #start-btn:hover {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.24);
      color: #fff;
    }

    #start-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    #err {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #000;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.4);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
    }

    #err.show { display: flex; }
  </style>
</head>
<body>
  <iframe
    id="game-frame"
    allowfullscreen
    allow="autoplay; fullscreen; clipboard-write; microphone; camera; gamepad; accelerometer; gyroscope"
  ></iframe>

  <div id="loader">
    <img id="logo-img" src="/logo.png" alt="">
    <button id="start-btn">Start session</button>
  </div>

  <div id="err">error, sorry!</div>

  <script src="/three.min.js"></script>
  <script src="/vantafog.min.js"></script>
  <script>
    VANTA.FOG({
      el: "#loader",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200,
      minWidth: 200,
      highlightColor: 0x965c32,
      midtoneColor: 0x916450,
      lowlightColor: 0x826d3b,
      baseColor: 0xf0900,
      blurFactor: 0.90,
      speed: 2.40,
      zoom: 0.30
    });

    var raw = location.search.slice(1);

    var useProxy = false;
    if (raw.endsWith("+s")) {
      useProxy = true;
      raw = raw.slice(0, -2);
    } else if (raw.endsWith("%2Bs")) {
      useProxy = true;
      raw = raw.slice(0, -4);
    }

    try { raw = decodeURIComponent(raw); } catch (e) {}

    var targetUrl = "";
    if (raw) {
      if (raw.startsWith("/")) {
        targetUrl = raw;
      } else if (/^https?:\/\//i.test(raw)) {
        targetUrl = raw;
      } else {
        targetUrl = "https://" + raw;
      }

      if (useProxy && !targetUrl.startsWith("/")) {
        try {
          var enc = btoa(encodeURIComponent(targetUrl))
            .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
          targetUrl = "/atlas/" + enc;
        } catch (e) {}
      }
    }

    var logo = document.getElementById("logo-img");
    var startBtn = document.getElementById("start-btn");
    var loader = document.getElementById("loader");
    var frame = document.getElementById("game-frame");
    var errEl = document.getElementById("err");

    var displayName = raw.replace(/^https?:\/\/(www\.)?/, "").split("/")[0] || raw;
    if (displayName) document.title = displayName + " — soloBiB";

    startBtn.addEventListener("click", function () {
      loader.classList.add("out");
      frame.classList.add("visible");
      setTimeout(function () { loader.style.display = "none"; }, 500);
    });

    if (!targetUrl) {
      loader.style.display = "none";
      errEl.classList.add("show");
    } else {
      var revealed = false;

      function showReady() {
        var anims = logo.getAnimations();
        if (!anims.length) { finalize(); return; }
        var anim = anims[0];
        var duration = anim.effect.getTiming().duration;
        var remaining = duration - (anim.currentTime % duration);
        setTimeout(function () {
          try { anim.commitStyles(); } catch (e) {}
          anim.cancel();
          logo.style.transform = "rotate(0deg)";
          void logo.offsetHeight;
          logo.style.transition = "transform 0.55s cubic-bezier(0.4, 0, 0.2, 1)";
          logo.style.transform = "translateY(-52px)";
          setTimeout(function () { startBtn.classList.add("visible"); }, 160);
        }, remaining);
      }

      function reveal() {
        if (revealed) return;
        revealed = true;
        showReady();
      }

      frame.src = targetUrl;
      frame.onload = function () { frame.onload = null; reveal(); };
      setTimeout(reveal, 10000);
    }
  </script>
</body>
</html>
