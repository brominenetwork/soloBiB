<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>soloBiB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #game-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 1;
    }

    #game-frame.visible { opacity: 1; }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    #loader.out {
      opacity: 0;
      pointer-events: none;
    }

    #logo-img {
      width: 168px;
      height: 168px;
      object-fit: contain;
      animation: logoSpin 1.4s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes logoSpin {
      0%   { transform: rotate(0deg);   animation-timing-function: ease-in; }
      50%  { transform: rotate(180deg); animation-timing-function: ease-out; }
      100% { transform: rotate(360deg); }
    }

    #brand-text {
      font-family: "Parkinsans", sans-serif;
      font-weight: 700;
      font-size: 52px;
      color: #fff;
      display: flex;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
      user-select: none;
    }

    #brand-text.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #brand-text span {
      display: inline-block;
      animation: wave 1.6s ease-in-out infinite;
      animation-delay: calc(var(--i) * 80ms);
    }

    @keyframes wave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    #err {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #000;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.4);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
    }

    #err.show { display: flex; }
  </style>
</head>
<body>
  <iframe
    id="game-frame"
    allowfullscreen
    allow="autoplay; fullscreen; clipboard-write; microphone; camera; gamepad; accelerometer; gyroscope"
  ></iframe>

  <div id="loader">
    <img id="logo-img" src="/logo.png" alt="">
    <div id="brand-text">
      <span style="--i:0">s</span><span style="--i:1">o</span><span style="--i:2">l</span><span style="--i:3">o</span><span style="--i:4">B</span><span style="--i:5">i</span><span style="--i:6">B</span>
    </div>
  </div>

  <div id="err">error, sorry!</div>

  <script src="/three.min.js"></script>
  <script src="/vantafog.min.js"></script>
  <script>
    VANTA.FOG({
      el: "#loader",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200,
      minWidth: 200,
      highlightColor: 0x965c32,
      midtoneColor: 0x916450,
      lowlightColor: 0x826d3b,
      baseColor: 0xf0900,
      blurFactor: 0.90,
      speed: 2.40,
      zoom: 0.30
    });

    var raw = location.search.slice(1);

    var useProxy = false;
    if (raw.endsWith("+s")) {
      useProxy = true;
      raw = raw.slice(0, -2);
    } else if (raw.endsWith("%2Bs")) {
      useProxy = true;
      raw = raw.slice(0, -4);
    }

    try { raw = decodeURIComponent(raw); } catch (e) {}

    var targetUrl = "";
    if (raw) {
      if (raw.startsWith("/")) {
        targetUrl = raw;
      } else if (/^https?:\/\//i.test(raw)) {
        targetUrl = raw;
      } else {
        targetUrl = "https://" + raw;
      }

      if (useProxy && !targetUrl.startsWith("/")) {
        try {
          var enc = btoa(encodeURIComponent(targetUrl))
            .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
          targetUrl = "/atlas/" + enc;
        } catch (e) {}
      }
    }

    var logo = document.getElementById("logo-img");
    var brandText = document.getElementById("brand-text");
    var loader = document.getElementById("loader");
    var frame = document.getElementById("game-frame");
    var errEl = document.getElementById("err");

    var displayName = raw.replace(/^https?:\/\/(www\.)?/, "").split("/")[0] || raw;
    if (displayName) document.title = displayName + " — soloBiB";

    function startSession() {
      loader.classList.add("out");
      frame.classList.add("visible");
      setTimeout(function () { loader.style.display = "none"; }, 500);
    }

    brandText.addEventListener("click", startSession);

    if (!targetUrl) {
      loader.style.display = "none";
      errEl.classList.add("show");
    } else {
      var revealed = false;

      function showReady() {
        var anims = logo.getAnimations();
        if (!anims.length) { finalize(); return; }
        var anim = anims[0];
        var duration = anim.effect.getTiming().duration;
        var remaining = duration - (anim.currentTime % duration);
        setTimeout(function () {
          try { anim.commitStyles(); } catch (e) {}
          anim.cancel();
          logo.style.transform = "rotate(0deg)";
          void logo.offsetHeight;
          logo.style.transition = "transform 0.55s cubic-bezier(0.4, 0, 0.2, 1)";
          logo.style.transform = "translateY(-52px)";
          setTimeout(function () { brandText.classList.add("visible"); }, 160);
        }, remaining);
      }

      function reveal() {
        if (revealed) return;
        revealed = true;
        showReady();
      }

      frame.src = targetUrl;
      frame.onload = function () { frame.onload = null; reveal(); };
      setTimeout(reveal, 10000);
    }
  </script>
</body>
</html>
