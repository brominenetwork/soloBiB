<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>soloBiB</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #game-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 1;
    }

    #game-frame.visible { opacity: 1; }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    #loader.out {
      opacity: 0;
      pointer-events: none;
    }

    #loader img {
      width: 88px;
      height: 88px;
      object-fit: contain;
      animation: logoSpin 1.4s ease-in-out infinite;
    }

    @keyframes logoSpin {
      0%   { transform: rotate(0deg);   animation-timing-function: ease-in; }
      50%  { transform: rotate(180deg); animation-timing-function: ease-out; }
      100% { transform: rotate(360deg); }
    }

    #err {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #000;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.4);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
    }

    #err.show { display: flex; }
  </style>
</head>
<body>
  <iframe
    id="game-frame"
    allowfullscreen
    allow="autoplay; fullscreen; clipboard-write; microphone; camera; gamepad; accelerometer; gyroscope"
  ></iframe>

  <div id="loader">
    <img src="/logo.png" alt="">
  </div>

  <div id="err">error, sorry!</div>

  <script>
    var raw = location.search.slice(1);

    var useProxy = false;
    if (raw.endsWith("+s")) {
      useProxy = true;
      raw = raw.slice(0, -2);
    } else if (raw.endsWith("%2Bs")) {
      useProxy = true;
      raw = raw.slice(0, -4);
    }

    try { raw = decodeURIComponent(raw); } catch (e) {}

    var targetUrl = "";
    if (raw) {
      if (raw.startsWith("/")) {
        targetUrl = raw;
      } else if (/^https?:\/\//i.test(raw)) {
        targetUrl = raw;
      } else {
        targetUrl = "https://" + raw;
      }

      if (useProxy && !targetUrl.startsWith("/")) {
        try {
          var enc = btoa(encodeURIComponent(targetUrl))
            .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
          targetUrl = "/atlas/" + enc;
        } catch (e) {}
      }
    }

    var loader = document.getElementById("loader");
    var frame = document.getElementById("game-frame");
    var errEl = document.getElementById("err");

    var displayName = raw.replace(/^https?:\/\/(www\.)?/, "").split("/")[0] || raw;
    if (displayName) document.title = displayName + " — soloBiB";

    if (!targetUrl) {
      loader.style.display = "none";
      errEl.classList.add("show");
    } else {
      var revealed = false;
      function reveal() {
        if (revealed) return;
        revealed = true;
        loader.classList.add("out");
        frame.classList.add("visible");
        setTimeout(function () { loader.style.display = "none"; }, 500);
      }

      frame.src = targetUrl;
      frame.onload = function () { frame.onload = null; reveal(); };
      setTimeout(reveal, 10000);
    }
  </script>
</body>
</html>
