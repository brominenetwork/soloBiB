  <style>
    :root {
      --bg: #050a12;
      --secondary-bg: #19232f;
      --third-bg: #222c38;
      --fourth-bg: #0e1219;
      --primary: #8aa5cc;
      --secondary: #5d7a9e;
      --text-color: #b8c6d8;
      --button-bg: #19232f;
      --button-hover: #243040;
      --gradient-start: #6bbfbb;
      --gradient-end: #2e6a9e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    #vanta-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    aside {
      position: relative;
      z-index: 10;
      width: 72px;
      background: rgba(10, 17, 29, 0.88);
      border-right: 1px solid rgba(164, 184, 219, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 4px;
      flex-shrink: 0;
      transition: width 0.2s ease, opacity 0.2s ease;
    }

    body.atlas-mode aside {
      width: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .nav-btn {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      border: none;
      background: none;
      color: var(--secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      text-decoration: none;
    }

    .nav-btn:hover, .nav-btn.active {
      background: var(--button-hover);
      color: var(--text-color);
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #atlas-fab {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 50;
      display: none;
      flex-direction: column;
      gap: 0;
    }

    body.atlas-mode #atlas-fab { display: flex; }

    #atlas-fab-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(43, 56, 77, 0.92);
      border: 1px solid rgba(164, 184, 219, 0.15);
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #atlas-fab-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #atlas-fab-menu {
      margin-top: 6px;
      background: rgba(33, 38, 48, 0.96);
      border: 1px solid rgba(164, 184, 219, 0.12);
      border-radius: 12px;
      overflow: hidden;
      display: none;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      min-width: 150px;
    }

    #atlas-fab-menu.open { display: flex; }

    .atlas-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      color: var(--text-color);
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      border: none;
      background: none;
      text-decoration: none;
      transition: background 0.1s;
      text-align: left;
      width: 100%;
    }

    .atlas-nav-item:hover { background: var(--button-hover); color: #fff; }

    .atlas-nav-item svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      opacity: 0.6;
    }

    .nav-spacer { flex: 1; }

    .nav-divider {
      width: 32px;
      height: 1px;
      background: rgba(164, 184, 219, 0.1);
      display: none;
      flex-shrink: 0;
    }

    body.game-mode .nav-divider { display: block; }

    .game-nav-btn {
      display: none;
    }

    body.game-mode .game-nav-btn { display: flex; }

    #frame {
      flex: 1;
      position: relative;
      z-index: 10;
      border: none;
      background: transparent;
      transition: opacity 0.15s ease;
    }

    .discord-fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 20;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(65, 138, 198, 0.4);
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .discord-fab:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 28px rgba(65, 138, 198, 0.6);
    }

    .discord-fab svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }
  </style>
</head>
<body>

      <a class="atlas-nav-item" data-src="/atlas/aHR0cHM6Ly92YXBvci5vbmwvcGFnZS9tdXNpYy9pbmRleC5odG1s">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 18V5l12-2v13" stroke="currentColor"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>

  <iframe id="frame" src="/home.html" allowtransparency="true"></iframe>

  <script src="/three.min.js"></script>
  <script src="/vantafog.min.js"></script>
  <script>

  VANTA.FOG({
   el: "#vanta-bg",
   mouseControls: true,
   touchControls: true,
   gyroControls: false,
   minHeight: 200.00,
   minWidth: 200.00,
   highlightColor: 0x111a2b,
   midtoneColor: 0x141c33,
   lowlightColor: 0x101229,
   baseColor: 0x0a0e1c,
   blurFactor: 0.90,
   speed: 3.00,
   zoom: 0.30
});
    (function () {
      var frame = document.getElementById("frame");
      var btns = document.querySelectorAll(".nav-btn[data-src]");
      var fabBtn = document.getElementById("atlas-fab-btn");
      var fabMenu = document.getElementById("atlas-fab-menu");
      var atlasNavItems = document.querySelectorAll(".atlas-nav-item[data-src]");

      function navigate(src) {
        var isAtlas = src.startsWith("/atlas/");
        document.body.classList.toggle("atlas-mode", isAtlas);
        btns.forEach(function (b) {
          b.classList.toggle("active", b.dataset.src === src);
        });
        fabMenu.classList.remove("open");

        frame.style.opacity = "0";
        frame.onload = null;
        frame.src = src;
        frame.onload = function () {
          frame.onload = null;
          frame.style.opacity = "1";
        };
      }

      btns.forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          navigate(btn.dataset.src);
        });
      });

      atlasNavItems.forEach(function (item) {
        item.addEventListener("click", function (e) {
          e.preventDefault();
          navigate(item.dataset.src);
        });
      });

      fabBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        fabMenu.classList.toggle("open");
      });

      document.addEventListener("click", function () {
        fabMenu.classList.remove("open");
      });

      document.getElementById("btn-game-back").addEventListener("click", function () {
        frame.contentWindow.postMessage({ type: "game-back" }, "*");
      });

      document.getElementById("btn-game-fullscreen").addEventListener("click", function () {
        frame.contentWindow.postMessage({ type: "game-fullscreen" }, "*");
      });

      window.addEventListener("message", function (e) {
        if (!e.data) return;
        if (e.data.type === "nav") navigate(e.data.src);
        if (e.data.type === "game-open") document.body.classList.add("game-mode");
        if (e.data.type === "game-close") document.body.classList.remove("game-mode");
      });
    })();
  </script>
