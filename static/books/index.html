 <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #000; --surface: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.06);
      --accent: #31ff92; --text: #f0f0f0; --muted: rgba(240,240,240,0.38);
      --proxy-h: 52px;
    }
    html, body {
      height: 100%;
      background: transparent;
      font-family: "Inter", sans-serif; color: var(--text); overflow-x: hidden;
    }

    header {
      padding: 28px 24px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header a {
      font-family: "Parkinsans", sans-serif;
      font-size: 28px; font-weight: 700;
      color: #fff; text-decoration: none;
      opacity: 0.7; transition: opacity 0.15s;
    }
    header a:hover { opacity: 1; }
    header h1 { font-size: 22px; font-weight: 600; }
    header .sep { color: var(--muted); font-size: 18px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 14px;
      padding: 8px 20px 120px;
    }

    .card {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer; border-radius: 14px; padding: 12px 8px;
      transition: background 0.15s;
    }
    .card:hover { background: var(--surface); }

    .thumb {
      width: 64px; height: 64px; border-radius: 12px;
      object-fit: cover; transition: transform 0.15s;
      background: #1a1a1a;
    }
    .card:hover .thumb { transform: scale(1.07); }

    .card span {
      font-size: 11px; font-weight: 500; color: var(--muted);
      text-align: center; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .books-search-wrap {
      position: relative;
      padding: 0 20px 16px;
      z-index: 10;
    }
    .books-search-bar {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px;
      padding: 10px 16px;
      backdrop-filter: blur(12px);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .books-search-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(49,255,146,0.15);
    }
    .books-search-bar i { color: var(--muted); font-size: 14px; transition: color 0.2s; }
    .books-search-bar:focus-within i { color: var(--accent); }
    #books-search {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-family: "Inter", sans-serif; font-size: 14px;
    }
    #books-search::placeholder { color: var(--muted); }

    .ac-dropdown {
      position: absolute; top: calc(100% - 8px); left: 20px; right: 20px;
      background: rgba(18,18,22,0.97); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.09); border-radius: 12px;
      overflow: hidden; z-index: 50; box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    }
    .ac-dropdown.hidden { display: none; }
    .ac-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; cursor: pointer;
      transition: background 0.12s; font-size: 13px; color: var(--text);
    }
    .ac-item:hover, .ac-item.active { background: rgba(255,255,255,0.07); }
    .ac-item:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.04); }
    .ac-thumb {
      width: 32px; height: 32px; border-radius: 8px;
      object-fit: cover; flex-shrink: 0; background: #1a1a1a;
    }
    .ac-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#proxy-bar {
      position: fixed; top: 0; left: 0; right: 0; height: var(--proxy-h);
      background: #1a1a1a; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; padding: 0 10px; z-index: 100;
    }
  </style>
</head>
<body>
  <div class="books-search-wrap">
    <div class="books-search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="books-search" type="text" placeholder="Search games..." autocomplete="off" spellcheck="false" />
    </div>
    <div id="books-ac" class="ac-dropdown hidden"></div>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    function openGame(url) {
      window.parent.postMessage({ type: "navigate", url }, "*");
    }

    let allGames = [];
    const grid = document.getElementById("grid");
    const booksSearch = document.getElementById("books-search");
    const booksAc = document.getElementById("books-ac");

    function renderGrid(games) {
      grid.innerHTML = "";
      games.forEach(game => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img class="thumb" src="${game.cover || ''}" alt="${game.name}" loading="lazy" onerror="this.style.background='#1a1a1a'"/>
          <span>${game.name}</span>
        `;
        card.addEventListener("click", () => openGame(game.url));
        grid.appendChild(card);
      });
    }

    function renderAc(games) {
      if (!games.length) { booksAc.classList.add("hidden"); return; }
      booksAc.innerHTML = games.slice(0, 7).map((g, i) => `
        <div class="ac-item" data-index="${i}">
          <img class="ac-thumb" src="${g.cover || ''}" alt="" onerror="this.style.opacity=0">
          <span class="ac-label">${g.name}</span>
        </div>
      `).join("");
      booksAc.querySelectorAll(".ac-item").forEach((el, i) => {
        el.addEventListener("mousedown", e => {
          e.preventDefault();
          openGame(games[i].url);
          booksAc.classList.add("hidden");
          booksSearch.value = "";
        });
      });
      booksAc.classList.remove("hidden");
    }

    booksSearch.addEventListener("input", () => {
      const q = booksSearch.value.trim().toLowerCase();
      if (!q) { booksAc.classList.add("hidden"); renderGrid(allGames); return; }
      const matches = allGames.filter(g => g.name.toLowerCase().includes(q));
      renderAc(matches);
      renderGrid(matches);
    });

    booksSearch.addEventListener("blur", () => setTimeout(() => booksAc.classList.add("hidden"), 150));

    fetch("/books/books.json")
      .then(r => r.json())
      .then(games => { allGames = games; renderGrid(games); });


  </script>
</body>
</html>
